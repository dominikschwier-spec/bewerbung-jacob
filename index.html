<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominik Schwier – Deckblatt JACOB Group</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#185FA5;--blue-l:#378ADD;--blue-ll:#B5D4F4;
  --teal:#1D9E75;--teal-l:#5DCAA5;--teal-ll:#9FE1CB;
  --flange:#0C447C;--dark:#1a1a18;--mid:#4a4a46;--light:#8a8a84;
}
html{
  min-height:100vh;
  background-color:#b8a888;
  background-image:url('desk-bg.svg');
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
}
body{width:230mm;height:297mm;margin:40px auto;background:#fff;
  box-shadow:0 6px 40px rgba(0,0,0,.22),0 1px 6px rgba(0,0,0,.12);
  font-family:'Calibri','Gill Sans MT',sans-serif;overflow:hidden;position:relative;}

/* OVERLAY */
#overlay{position:absolute;inset:0;z-index:200;pointer-events:none;image-rendering:pixelated;}

/* ── HEADER ── */
.page{position:absolute;inset:0;padding:52px 52px 0 52px;display:flex;flex-direction:column;}

.header-row{display:flex;justify-content:space-between;align-items:flex-start;
  opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translateY(-8px);}
.header-row.show{opacity:1;transform:translateY(0);}

.sender-block p{font-size:10px;color:var(--dark);line-height:1.7;}
.sender-name{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:13px;font-weight:700;
  color:var(--dark);margin-bottom:3px;}

.date-block{text-align:right;font-family:'Calibri','Gill Sans MT',sans-serif;font-size:9px;
  color:var(--light);letter-spacing:1px;line-height:1.9;}
.sender-block .eyebrow-tag{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:11px;letter-spacing:2.5px;
  color:var(--blue);text-transform:uppercase;margin-bottom:32px;font-weight:600;}

/* ── TITLE BLOCK ── */
.title-block{margin-top:300px;
  opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translateY(10px);}
.title-block.show{opacity:1;transform:translateY(0);}

.betreff-label{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:9px;letter-spacing:2px;
  color:var(--teal);text-transform:uppercase;margin-bottom:10px;}
.betreff-title{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:18px;font-weight:700;
  color:var(--dark);line-height:1.3;border-left:3px solid var(--blue-l);padding-left:14px;}

/* PIPE DIVIDER */
.h-pipe{height:4px;background:linear-gradient(90deg,var(--blue-l),var(--teal-l));
  border-radius:2px;margin:28px 0;position:relative;
  opacity:0;transform:scaleX(0);transform-origin:left center;
  transition:opacity .2s ease, transform .7s cubic-bezier(.4,0,.2,1);}
.h-pipe.show{opacity:1;transform:scaleX(1);}
.h-pipe::before,.h-pipe::after{content:'';position:absolute;top:-4px;width:7px;height:12px;
  background:var(--flange);border-radius:2px;}
.h-pipe::before{left:0}.h-pipe::after{right:0}
.hpm{position:absolute;top:-4px;left:40%;width:7px;height:12px;background:var(--teal);border-radius:2px;}
.hpm2{position:absolute;top:-4px;left:70%;width:7px;height:12px;background:var(--blue);border-radius:2px;}

/* ── CONTENT ROW ── */
.content-row{display:flex;gap:36px;align-items:stretch;
  opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translateY(8px);}
.content-row.show{opacity:1;transform:translateY(0);}

/* Photo block */
.photo-block{flex-shrink:0;width:135px;height:165px;position:relative;
  overflow:hidden;background:transparent;}
.photo-placeholder{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--blue-ll);font-family:'Calibri','Gill Sans MT',sans-serif;
  font-size:8px;letter-spacing:1px;opacity:.6;}
/* Photo rendered on overlay canvas - block just reserves space */

/* Contact */
.contact-block{flex:1;display:flex;flex-direction:column;justify-content:flex-end;transform:translateY(14px);}
.contact-group{margin-bottom:18px;}
.contact-group:last-child{margin-bottom:0;}
.contact-label{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:9px;letter-spacing:1.5px;
  color:var(--light);text-transform:uppercase;margin-bottom:3px;}
.contact-value{font-size:11px;color:var(--mid);line-height:1.6;}
.contact-value a{color:var(--blue);text-decoration:none;}

.tagline{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:11.5px;font-style:italic;
  color:var(--light);line-height:1.65;margin-top:20px;max-width:240px;}

.doc-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}

/* Pills bottom-right next to pipe */
.pills-bottom{
  position:absolute;
  bottom:18px;
  left:200px;
  display:flex;
  flex-direction:row;
  gap:8px;
  opacity:0;transition:opacity .6s ease;
}
.pills-bottom.show{opacity:1;}
.pill{font-family:'Calibri','Gill Sans MT',sans-serif;font-size:11px;letter-spacing:1.5px;
  color:var(--blue);text-transform:uppercase;padding:6px 14px;
  border:1px solid var(--blue-ll);border-radius:20px;
  display:flex;align-items:center;gap:6px;
  text-decoration:none;cursor:pointer;}
.pill:hover{background:var(--blue-ll);}
.pill-dot{width:4px;height:4px;border-radius:50%;background:var(--teal-l);}

/* ── MARIO PIPES AT BOTTOM ── */
.pipes-area{position:absolute;bottom:0;left:42px;display:flex;align-items:flex-end;gap:14px;z-index:5;}

.mario-pipe .pipe-body{
  transform:scaleY(0);transform-origin:bottom center;
  transition:transform .8s cubic-bezier(.4,0,.2,1);}
.mario-pipe .pipe-cap{
  opacity:0;transform:translateY(6px);
  transition:opacity .3s ease,transform .3s ease;transition-delay:.8s;}
.pipes-area.show .mario-pipe .pipe-body{transform:scaleY(1);}
.pipes-area.show .mario-pipe .pipe-cap{opacity:1;transform:translateY(0);}

.mario-pipe{display:flex;flex-direction:column;align-items:center;position:relative;}
.pipe-cap{border-radius:5px 5px 0 0;position:relative;z-index:2;}
.pipe-body{position:relative;overflow:hidden;}
.pipe-shine{position:absolute;left:6px;top:0;width:7px;height:100%;
  background:rgba(255,255,255,0.18);border-radius:4px;}
.pipe-fill-inner{position:absolute;bottom:0;left:0;right:0;height:0%;
  transition:height 1.6s cubic-bezier(.4,0,.2,1);}

/* Big pipe (figure jumps in here) */
.pipe-big .pipe-cap{width:72px;height:20px;
  background:linear-gradient(90deg,var(--flange),var(--blue-l),var(--flange));}
.pipe-big .pipe-body{width:56px;height:110px;
  background:linear-gradient(90deg,var(--flange),var(--blue),var(--blue-l),var(--blue));}
.pipe-big .pipe-fill-inner{background:linear-gradient(180deg,var(--teal-l),var(--teal));}

/* Small decorative pipe */
.pipe-small .pipe-cap{width:50px;height:14px;
  background:linear-gradient(90deg,var(--flange),var(--blue-l),var(--flange));}
.pipe-small .pipe-body{width:38px;height:68px;
  background:linear-gradient(90deg,var(--flange),var(--blue),var(--blue-l),var(--blue));}
.pipe-small .pipe-fill-inner{background:linear-gradient(180deg,var(--teal-ll),var(--teal-l));}

/* JACOB flag – attached to right side of pipe body */
.jacob-flag{
  position:absolute;
  top:-30px;
  left:62px;         /* right edge of the 56px pipe body (centered in 72px cap) */
  display:flex;
  align-items:flex-start;
  opacity:0;
  transition:opacity .5s ease;
  transform:rotate(14deg);
  transform-origin:left center;
}
.jacob-flag.show{opacity:1;}
.flag-pole{width:3px;height:38px;background:var(--flange);border-radius:1px;}
.flag-body{
  margin-top:2px;padding:5px 13px;
  background:linear-gradient(90deg,var(--teal),var(--teal-l));
  border-radius:0 4px 4px 0;
  font-family:'Calibri','Gill Sans MT',sans-serif;
  font-size:9px;letter-spacing:2px;color:#fff;text-transform:uppercase;white-space:nowrap;
  transform-origin:left center;animation:flagWave 2.5s ease-in-out infinite;
}
@keyframes flagWave{0%,100%{transform:skewY(0)scaleX(1)}50%{transform:skewY(-2deg)scaleX(.96)}}

/* 1UP burst */
.coin{position:absolute;font-size:18px;font-family:'Calibri','Gill Sans MT',sans-serif;
  font-weight:700;letter-spacing:1px;color:var(--teal);pointer-events:none;z-index:300;
  animation:coinUp 1.8s ease forwards;}
@keyframes coinUp{0%{transform:translateY(0)scale(1);opacity:1}70%{opacity:1}100%{transform:translateY(-60px)scale(.6);opacity:0}}

@media print{
  html,body{width:210mm;height:297mm;overflow:hidden;}
  #overlay,.coin{display:none!important;}
  .jacob-flag{opacity:1!important;}
  .pipe-fill-inner{height:100%!important;}
  .header-row,.title-block,.h-pipe,.content-row{opacity:1!important;transform:none!important;}
  .photo-placeholder{display:none;}
}
</style>

<script>
// ─── SPRITE DEFINITION (Dominik: Brille, Bart, braunes Jackett) ───
const H='#4a3f3a',S='#D4A882',G='#404040',EY='#1a1510';
const B='#3a3030',J='#6B3A2A',W='#f0ece8',P='#252525',SH='#1a1515';
const _=null;
const FRAMES=[
 // Frame 0 – stand
 [[_,_,_,H,H,H,H,H,H,H,H,_,_,_,_,_],[_,_,H,H,H,H,H,H,H,H,H,H,_,_,_,_],[_,_,H,S,S,S,S,S,S,S,S,H,_,_,_,_],[_,_,S,S,S,S,S,S,S,S,S,_,_,_,_,_],[_,_,S,G,G,G,S,S,G,G,G,S,_,_,_,_],[_,_,S,G,EY,G,G,G,G,EY,G,S,_,_,_,_],[_,_,S,G,G,G,S,S,G,G,G,S,_,_,_,_],[_,_,S,S,S,S,S,S,S,S,S,_,_,_,_,_],[_,_,B,B,S,S,S,S,B,B,_,_,_,_,_,_],[_,_,B,B,B,B,B,B,B,B,_,_,_,_,_,_],[_,J,J,J,J,W,W,J,J,J,J,J,_,_,_,_],[J,J,J,W,W,W,W,W,W,J,J,J,J,_,_,_],[J,J,W,W,W,W,W,W,W,W,J,J,_,_,_,_],[J,J,J,J,J,J,J,J,J,J,J,J,_,_,_,_],[_,J,J,J,J,J,J,J,J,J,J,_,_,_,_,_],[_,_,J,J,J,J,J,J,J,J,_,_,_,_,_,_],[_,_,P,P,P,P,P,P,P,P,_,_,_,_,_,_],[_,P,P,P,_,_,_,_,P,P,P,_,_,_,_,_],[P,P,P,_,_,_,_,_,_,P,P,P,_,_,_,_],[P,P,P,_,_,_,_,_,_,P,P,P,_,_,_,_],[SH,SH,SH,_,_,_,_,_,_,SH,SH,SH,_,_,_,_],[SH,SH,SH,SH,_,_,_,SH,SH,SH,SH,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
 // Frame 1 – step
 [[_,_,_,H,H,H,H,H,H,H,H,_,_,_,_,_],[_,_,H,H,H,H,H,H,H,H,H,H,_,_,_,_],[_,_,H,S,S,S,S,S,S,S,S,H,_,_,_,_],[_,_,S,S,S,S,S,S,S,S,S,_,_,_,_,_],[_,_,S,G,G,G,S,S,G,G,G,S,_,_,_,_],[_,_,S,G,EY,G,G,G,G,EY,G,S,_,_,_,_],[_,_,S,G,G,G,S,S,G,G,G,S,_,_,_,_],[_,_,S,S,S,S,S,S,S,S,S,_,_,_,_,_],[_,_,B,B,S,S,S,S,B,B,_,_,_,_,_,_],[_,_,B,B,B,B,B,B,B,B,_,_,_,_,_,_],[_,J,J,J,J,W,W,J,J,J,J,J,_,_,_,_],[J,J,J,W,W,W,W,W,W,J,J,J,J,_,_,_],[J,J,W,W,W,W,W,W,W,W,J,J,_,_,_,_],[J,J,J,J,J,J,J,J,J,J,J,J,_,_,_,_],[_,J,J,J,J,J,J,J,J,J,J,_,_,_,_,_],[_,_,J,J,J,J,J,J,J,J,_,_,_,_,_,_],[_,_,P,P,P,P,P,P,P,P,_,_,_,_,_,_],[P,P,P,_,_,_,_,_,_,_,P,P,_,_,_,_],[P,P,_,_,_,_,_,_,_,_,_,P,P,_,_,_],[P,P,_,_,_,_,_,_,_,_,_,P,P,_,_,_],[SH,SH,_,_,_,_,_,_,_,_,_,SH,SH,_,_,_],[SH,SH,SH,_,_,_,_,_,_,SH,SH,SH,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]]
];

// ─── OVERLAY SETUP ───
const OV=document.getElementById('overlay');
const oc=OV.getContext('2d');
OV.width=document.body.offsetWidth||794;
OV.height=document.body.offsetHeight||1123;

function bOff(){return document.body.getBoundingClientRect();}
function toBody(el){
  const b=bOff(),r=el.getBoundingClientRect();
  return{x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height};
}

// ─── HELPERS ───
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function easeInCubic(t){return t*t*t;}

// ─── DRAW SPRITE ───
function drawSprite(x,y,frame,alpha,sc){
  oc.save();oc.globalAlpha=alpha;
  FRAMES[frame%2].forEach((row,py)=>row.forEach((c,px)=>{
    if(!c)return;
    oc.fillStyle=c;
    oc.fillRect(x+px*sc,y+py*sc,sc,sc);
  }));
  oc.restore();
}

// ─── PARTICLES ───
let particles=[];
function buildParticles(img,px,py,pw,ph){
  const{sx,sy,sw,sh}=coverCoords(img,pw,ph);
  const tc=document.createElement('canvas');
  tc.width=pw;tc.height=ph;
  const tctx=tc.getContext('2d');
  tctx.drawImage(img,sx,sy,sw,sh,0,0,pw,ph);
  particles=[];
  const step=5;
  for(let iy=0;iy<ph;iy+=step)for(let ix=0;ix<pw;ix+=step){
    const d=tctx.getImageData(ix,iy,1,1).data;
    if(d[3]<20)continue;
    const ang=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*5;
    particles.push({
      x:px+ix,y:py+iy,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.5,
      color:`rgb(${d[0]},${d[1]},${d[2]})`,
      size:step,alpha:1
    });
  }
}

// ─── PHOTO DRAW ───
let photoImg=null;
let phX=0,phY=0,phW=135,phH=165; // body coords

function coverCoords(img,dw,dh){
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const scale=Math.max(dw/iw,dh/ih);
  const sw=dw/scale,sh=dh/scale;
  return{sx:(iw-sw)/2,sy:(ih-sh)/2,sw,sh};
}

function drawPhoto(alpha){
  if(!photoImg)return;
  const{sx,sy,sw,sh}=coverCoords(photoImg,phW,phH);
  oc.save();oc.globalAlpha=alpha;
  oc.drawImage(photoImg,sx,sy,sw,sh,phX,phY,phW,phH);
  oc.restore();
}

function drawPhotoPixelated(alpha,block){
  if(!photoImg)return;
  const{sx,sy,sw,sh}=coverCoords(photoImg,phW,phH);
  const stW=Math.max(1,Math.ceil(phW/block));
  const stH=Math.max(1,Math.ceil(phH/block));
  const tc=document.createElement('canvas');
  tc.width=stW;tc.height=stH;
  const tctx=tc.getContext('2d');
  tctx.imageSmoothingEnabled=false;
  tctx.drawImage(photoImg,sx,sy,sw,sh,0,0,stW,stH);
  oc.save();oc.globalAlpha=alpha;
  oc.imageSmoothingEnabled=false;
  oc.drawImage(tc,phX,phY,phW,phH);
  oc.restore();
}

// ─── COIN ───
function spawnCoin(bx,by){
  const c=document.createElement('div');
  c.className='coin';c.textContent='1UP';
  c.style.left=bx+'px';c.style.top=by+'px';
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),800);
}

// ─── ANIMATION STATE ───
let phase='idle',phaseStart=0,lastTs=0,rafId=null,pipeShown=false;
let sprX=0,sprY=0,sprAlpha=0,sprScale=3;
let walkFrame=0,walkTick=0;
let pixBlock=1;
let jumpStartX=0,jumpStartY=0,jumpEndX=0,jumpEndY=0;

const sprW=16*3,sprH=24*3;

function getPipeTopPos(){
  const pc=document.getElementById('pipe-big');
  const cap=pc.querySelector('.pipe-cap');
  const b=bOff();
  const r=cap.getBoundingClientRect();
  return{
    x:r.left-b.left+r.width/2-sprW/2,
    y:r.top-b.top-sprH
  };
}

function loop(ts){
  const dt=Math.min(ts-lastTs,50);
  lastTs=ts;
  oc.clearRect(0,0,OV.width,OV.height);

  if(phase==='photo'){
    const el=ts-phaseStart;
    drawPhoto(Math.min(el/700,1));
    if(el>2200){phase='pixelate';phaseStart=ts;pixBlock=1;}

  }else if(phase==='pixelate'){
    const el=ts-phaseStart;
    pixBlock=1+Math.floor(easeInOut(Math.min(el/700,1))*20);
    drawPhotoPixelated(1,pixBlock);
    if(el>800){
      try{buildParticles(photoImg,phX,phY,phW,phH);}catch(e){particles=[];}
      phase='scatter';phaseStart=ts;
    }

  }else if(phase==='scatter'){
    const el=ts-phaseStart;
    // update particles
    particles.forEach(p=>{
      p.x+=p.vx*(dt*0.06);p.y+=p.vy*(dt*0.06);
      p.vy+=0.08*(dt*0.06);
      p.alpha=Math.max(0,p.alpha-0.009*(dt*0.06)*10);
    });
    oc.save();
    particles.forEach(p=>{
      if(p.alpha<=0)return;
      oc.globalAlpha=p.alpha;oc.fillStyle=p.color;
      oc.fillRect(p.x,p.y,p.size,p.size);
    });
    oc.restore();
    // sprite fades in after 500ms — pipe appears at same moment
    if(el>500){
      if(!pipeShown){
        pipeShown=true;
        document.querySelector('.pipes-area').classList.add('show');
      }
      sprAlpha=Math.min((el-500)/700,1);
      const pp=toBody(document.getElementById('photo-block'));
      sprX=pp.x+pp.w/2-sprW/2;
      sprY=pp.y+pp.h/2-sprH/2;
      drawSprite(sprX,sprY,0,sprAlpha,3);
    }
    if(el>1300){particles=[];phase='bounce';phaseStart=ts;}

  }else if(phase==='bounce'){
    const el=ts-phaseStart;
    const b=Math.max(-Math.sin(el/280*Math.PI)*10,0);
    const pp=toBody(document.getElementById('photo-block'));
    sprX=pp.x+pp.w/2-sprW/2;
    sprY=pp.y+pp.h/2-sprH/2-b;
    walkTick+=dt;if(walkTick>200){walkFrame++;walkTick=0;}
    drawSprite(sprX,sprY,walkFrame,1,3);
    if(el>700){
      // prep jump target
      const pt=getPipeTopPos();
      jumpStartX=sprX;jumpStartY=sprY;
      jumpEndX=pt.x;jumpEndY=pt.y;
      phase='run';phaseStart=ts;
    }

  }else if(phase==='run'){
    const el=ts-phaseStart;
    const dur=800;
    const t=Math.min(el/dur,1);
    // arc: parabola up then down
    const arcH=80; // peak height
    const arcY=-Math.sin(t*Math.PI)*arcH;
    sprX=lerp(jumpStartX,jumpEndX,easeInOut(t));
    sprY=lerp(jumpStartY,jumpEndY,easeInOut(t))+arcY;
    walkTick+=dt;if(walkTick>130){walkFrame++;walkTick=0;}
    drawSprite(sprX,sprY,walkFrame,1,3);
    if(t>=1){
      spawnCoin(sprX+14,sprY-12);
      document.getElementById('jacob-flag').classList.add('show');
      // start pipe fill
      document.getElementById('pf-big').style.height='100%';
      phase='enter';phaseStart=ts;
    }

  }else if(phase==='enter'){
    const el=ts-phaseStart;
    const t=Math.min(el/500,1);
    const sc=3*(1-easeOut(t)*0.9);
    const a=1-easeOut(t);
    const pt=getPipeTopPos();
    drawSprite(pt.x+(sprW-16*sc)/2,pt.y+t*sprH*1.1,walkFrame,a,sc);
    if(t>=1){phase='done';oc.clearRect(0,0,OV.width,OV.height);document.getElementById('pills-bottom').classList.add('show');window.animDone=true;return;}
  }

  rafId=requestAnimationFrame(loop);
}
