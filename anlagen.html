<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anlagen – Dominik Schwier</title>
<style>
:root{
  --blue:#185FA5;--blue-ll:#B5D4F4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  overflow:hidden;
}
html{
  background-color:#b8a888;
  background-image:url('desk-bg.svg');
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
}
body{
  font-family:'Calibri','Gill Sans MT',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:transparent;
  padding:0;
}
.paper{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#fff;
  box-shadow:0 4px 28px rgba(0,0,0,.13),0 1px 4px rgba(0,0,0,.08);
}
.topbar{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  border-bottom:1px solid #d8d8d0;
}
.topbar-title{
  font-size:11pt;font-weight:700;
  color:var(--blue);letter-spacing:.5px;
}
.nav-back{
  font-size:9pt;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--blue);text-decoration:none;
  border:1px solid var(--blue-ll);border-radius:20px;
  padding:5px 14px;
  transition:background .2s;
}
.nav-back:hover{background:var(--blue-ll);}
embed{
  flex:1;
  width:100%;
  display:block;
  min-height:0;
}
</style>
</head>
<body>

<div class="paper">
  <div class="topbar">
    <span class="topbar-title">Anlagen – Dominik Schwier</span>
    <a class="nav-back" href="index.html">← Deckblatt</a>
  </div>
  <embed src="anlagen.pdf" type="application/pdf">
</div>

</body>
</html>
